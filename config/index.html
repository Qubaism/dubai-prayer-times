<body><main><span class="ok">Ready to add</span><h1>Dubai Prayer Times</h1><p>Add the live prayer card to this chat. It shows Fajr, Sunrise, Dhuhr, Asr, Maghrib and Isha, highlights the next prayer and refreshes its seconds countdown in Asia/Dubai.</p></main>
<script>(async()=>{const origin="https://qubaism.github.io/dubai-prayer-times";await microsoftTeams.app.initialize();microsoftTeams.pages.config.registerOnSaveHandler((event)=>{microsoftTeams.pages.config.setConfig({contentUrl:origin,websiteUrl:origin,suggestedDisplayName:"Dubai Prayer Times"}).then(()=>event.notifySuccess()).catch(e=>event.notifyFailure(String(e)))});microsoftTeams.pages.config.setValidityState(true)})().catch(()=>{});</script></body></html>
